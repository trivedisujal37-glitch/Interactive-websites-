<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Interior Planner - Futuristic Spatial Design</title>
    <!-- Connect Futuristic Stylesheet -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div class="container">
    <!-- Hero Section -->
    <header>
        <div class="hero-badge">
            <span class="pulse-dot"></span>
            AI-Powered Spatial Engine
        </div>
        <h1>Smart Interior Planner</h1>
        <p class="subtitle">Design smarter. Plan better. Create your perfect space.</p>

        <!-- Futuristic CSS-Only Interior Visual -->
        <div class="spatial-visual-wrap" aria-hidden="true">
            <div class="isometric-room">
                <div class="iso-grid">
                    <div class="iso-wall-left"></div>
                    <div class="iso-node n1"></div>
                    <div class="iso-node n2"></div>
                    <div class="iso-node n3"></div>
                    <div class="iso-beam"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Error Display Box (Dynamic) -->
    <div id="errorContainer"></div>

    <!-- Main Planner Form Card -->
    <div class="card">
        <h2>
            Interactive Floor & Interior Studio
            <span class="section-tag">Studio v2.0</span>
        </h2>

        <form id="plannerForm">
            <!-- 1. Room Details Section -->
            <div class="form-section">
                <div class="form-section-title">
                    <span class="num">1</span>
                    Room Details
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="roomType">Room Type</label>
                        <select id="roomType">
                            <option value="">-- Select Room Type --</option>
                            <option value="Bedroom">Bedroom</option>
                            <option value="Living Room">Living Room</option>
                            <option value="Kitchen">Kitchen</option>
                            <option value="Office">Office</option>
                            <option value="Study Room">Study Room</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="width">Room Width (feet)</label>
                        <input type="number" id="width" placeholder="e.g. 14" min="1" step="0.5">
                    </div>

                    <div class="form-group">
                        <label for="length">Room Length (feet)</label>
                        <input type="number" id="length" placeholder="e.g. 16" min="1" step="0.5">
                    </div>
                </div>
            </div>

            <!-- 2. Design Preferences Section -->
            <div class="form-section">
                <div class="form-section-title">
                    <span class="num">2</span>
                    Design Preferences
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="interiorStyle">Interior Style</label>
                        <select id="interiorStyle">
                            <option value="">-- Select Style --</option>
                            <option value="Modern">Modern</option>
                            <option value="Minimal">Minimal</option>
                            <option value="Luxury">Luxury</option>
                            <option value="Industrial">Industrial</option>
                            <option value="Scandinavian">Scandinavian</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="colorTheme">Color Theme</label>
                        <select id="colorTheme">
                            <option value="">-- Select Color Theme --</option>
                            <option value="Warm">Warm</option>
                            <option value="Cool">Cool</option>
                            <option value="Neutral">Neutral</option>
                            <option value="Earthy">Earthy</option>
                            <option value="Monochrome">Monochrome</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 3. Budget Section -->
            <div class="form-section">
                <div class="form-section-title">
                    <span class="num">3</span>
                    Budget Allocation
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="budget">Total Budget (₹ INR)</label>
                        <input type="number" id="budget" placeholder="e.g. 80000" min="1" step="1000">
                    </div>
                </div>
            </div>

            <!-- 4. Furniture Selection Section -->
            <div class="form-section">
                <div class="form-section-title">
                    <span class="num">4</span>
                    Furniture Selection
                </div>
                <label>Select essential items for spatial & cost analysis</label>
                <div class="furniture-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="bed">
                        <span>Bed</span>
                        <span class="price-tag">₹25,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="wardrobe">
                        <span>Wardrobe</span>
                        <span class="price-tag">₹30,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="sideTable">
                        <span>Side Table</span>
                        <span class="price-tag">₹4,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="studyTable">
                        <span>Study Table</span>
                        <span class="price-tag">₹8,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="mirror">
                        <span>Mirror</span>
                        <span class="price-tag">₹3,500</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="sofa">
                        <span>Sofa</span>
                        <span class="price-tag">₹35,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="coffeeTable">
                        <span>Coffee Table</span>
                        <span class="price-tag">₹7,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="tvUnit">
                        <span>TV Unit</span>
                        <span class="price-tag">₹15,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="workDesk">
                        <span>Work Desk</span>
                        <span class="price-tag">₹12,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="officeChair">
                        <span>Office Chair</span>
                        <span class="price-tag">₹8,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="bookshelf">
                        <span>Bookshelf</span>
                        <span class="price-tag">₹10,000</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="furniture" value="lighting">
                        <span>Lighting</span>
                        <span class="price-tag">₹5,000</span>
                    </label>
                </div>
            </div>

            <!-- 5. Generate Button -->
            <button type="submit" class="btn-primary" id="generatePlanBtn">
                <span class="btn-icon">⚡</span>
                <span>Generate Smart Interior Plan</span>
            </button>
        </form>
    </div>

    <!-- Results Section (Populated dynamically by planner.js) -->
    <div id="resultContainer"></div>
</div>

<!-- Load JavaScript Modules in Strict Dependency Order -->
<script src="static/js/validation.js"></script>
<script src="static/js/calculator.js"></script>
<script src="static/js/recommendations.js"></script>
<script src="static/js/planner.js"></script>

</body>
</html>
